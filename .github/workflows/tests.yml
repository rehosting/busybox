name: Check that the code compiles

# Build busybox for every guest arch through this repo's OWN flake
# (`nix build .#dist` cross-builds all arches into the /igloo_static fragment
# penguin consumes). Self-contained -- no longer borrows penguin-tools' machinery.
# The flake supplies the libhc header from its own input.

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: rehosting-arc
    env:
      USER: runner
      LOGNAME: runner
      TMPDIR: /home/runner/_work/_temp
      XDG_CACHE_HOME: /home/runner/_work/.cache
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner directories
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq xz-utils

      # Use the org-shared Nix setup (same as penguin's image build): pins a
      # modern Nix whose hashing matches the flake.lock and disables the KVM
      # setup that Arc pods lack a working udevd for.
      - name: Set up Nix
        uses: rehosting/ci/actions/nix-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-url: https://releases.nixos.org/nix/nix-2.31.2/install
          enable-kvm: false
          extra-nix-config: |
            max-jobs = 8
            cores = 8
          cache-backend: cachix
          cachix-name: rehosting-tools
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build busybox for all guest arches (this checkout)
        env:
          # install-nix-action's github_access_token isn't honored on this
          # pre-installed-nix runner, so the GitHub flake fetcher went out
          # anonymous and hit the 60/hr shared-IP limit (HTTP 429). Authenticate
          # the fetcher directly via NIX_CONFIG (public repo, so any valid token
          # lifts the limit to 5000/hr).
          NIX_CONFIG: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          nix build --accept-flake-config .#dist --no-link --print-out-paths -L
